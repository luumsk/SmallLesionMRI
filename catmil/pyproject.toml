[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "catmil"
version = "0.1.0"
description = "CATMIL loss (component-adaptive Tversky + lesion-level MIL) and baseline losses for small lesion segmentation, with nnU-Net v2 integration."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Minh Sao Khue Luu" },
  { name = "Evgeniy N. Pavlovskiy" },
  { name = "Bair N. Tuchinov" },
]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "scipy"]
keywords = ["medical image segmentation", "loss function", "small lesions", "nnU-Net", "MRI"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
nnunet = ["nnunetv2>=2.1"]
monai = ["monai>=1.3"]
fast-cc = ["connected-components-3d>=3.12"]
io = ["nibabel"]
test = ["pytest", "monai>=1.3"]

[project.scripts]
catmil = "catmil.cli:main"
catmil-nnunet = "catmil.integrations.nnunet_install:main"

[project.urls]
Repository = "https://github.com/luumsk/SmallLesionMRI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
